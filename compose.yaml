name: marketone-demo
services:
  web:
    image: caddy:2.11.4-alpine
    pull_policy: never
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    ports:
      - '127.0.0.1:8094:8094'
    volumes:
      - ./dist:/srv:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700
      - /data:uid=1000,gid=1000,mode=0700
    networks:
      edge:
        aliases: [marketone-demo-web]
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8094/']
      interval: 30s
      timeout: 3s
      retries: 3
networks:
  edge:
    external: true
    name: kola-construction_kola
